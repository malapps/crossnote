<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>App Page</title>
  <style>
    body { font-family: sans-serif; max-width: 600px; margin: 4rem auto; }
  </style>
</head>
<body>

  <h1>Welcome</h1>
  <p id="output"></p>

  <script>
  // Split out full path to extract initials
  const path = window.location.pathname;  
  const parts = path.split("/").filter(Boolean);  
  const initials = parts.pop() || "";

  // Save initials for future auto-forwarding by indexhtml
  if (initials) {
    localStorage.setItem("lastInitials", initials);
  }

  document.getElementById("output").textContent =
    initials ? `Your initials are: ${initials}` : "No initials detected.";
</script>

</body>
</html>
