<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>App Page</title>
  <style>
    body { font-family: sans-serif; max-width: 600px; margin: 4rem auto; }
  </style>
</head>
<body>

  <h1>Welcome</h1>
  <p id="output"></p>

  <script>
  // Full path, e.g. "/repo/fdr"
  const path = window.location.pathname;

  // Split into parts: ["", "repo", "fdr"]
  const parts = path.split("/").filter(Boolean);

  // The last part is always the initials
  const initials = parts.pop() || "";

  document.getElementById("output").textContent =
    initials ? `Your initials are: ${initials}` : "No initials detected.";
</script>

</body>
</html>
