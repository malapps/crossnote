<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>App Page</title>
  <style>
    body { font-family: sans-serif; max-width: 600px; margin: 4rem auto; }
  </style>
</head>
<body>

  <h1>Welcome</h1>
  <p id="output"></p>

  <script>
    // Extract the path, e.g. /fdr → "fdr"
    const path = window.location.pathname.replace("./", "");

    // If GitHub adds /404.html, strip it
    const clean = path.replace("404.html", "");

    document.getElementById("output").textContent =
      clean ? `Your initials are: ${clean}` : "No initials detected.";
  </script>

</body>
</html>
