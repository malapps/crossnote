<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Cross Note</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #D0E8D0;
      margin: 0;
      padding: 0;
    }

    .container {
      max-width: 600px;
      margin: 40px auto;
      padding: 20px;
    }

    h1 {
      border-bottom: 2px solid #000;
      padding-bottom: 5px;
      text-align: center;
    }

    .input-row {
      display: flex;
      gap: 10px;
      margin-bottom: 10px;
    }

    textarea {
      flex: 1;
      padding: 12px;
      font-size: 16px;
      resize: vertical;
    }

    button {
      padding: 12px 18px;
      font-size: 16px;
      cursor: pointer;
    }

    .delete-btn {
      width: 100%;
      margin-bottom: 20px;
    }

    .note {
      display: flex;
      gap: 10px;
      padding: 10px 0;
      border-bottom: 1px solid #aaa;
    }

    .note-text {
      flex: 1;
      word-break: break-word;
    }
  </style>
</head>
<body>

<div class="container">
  <h1>Cross Note</h1>

  <div class="input-row">
    <textarea id="noteInput" rows="2" placeholder="Type a note.."></textarea>
    <button id="saveBtn">SAVE</button>
  </div>

  <button class="delete-btn" id="deleteBtn">Delete Selected</button>
  <div id="notes"></div>
</div>

<script>
  // 🔹 Firebase config (PASTE YOURS HERE)
  const firebaseConfig = {
    apiKey: "AIzaSyDWPnTqWVUNOS1RAh9DtTE_OVMUobc9jPs",
    authDomain: "milk-a5681.firebaseapp.com",
    projectId: "milk-a5681",
    storageBucket: "milk-a5681.firebasestorage.app",
    messagingSenderId: "502144590699",
    appId: "1:502144590699:web:7fc917c4cedfdb78fea22e",
    measurementId: "G-KRWCX432HD"
  };

  firebase.initializeApp(firebaseConfig);
  const db = firebase.firestore();

  // 🔹 Workspace id from URL
  const base = '/crossnote/';
  const userId = location.pathname.replace(base, '').replace('/', '');

  const notesDiv = document.getElementById('notes');
  const input = document.getElementById('noteInput');

  const notesRef = db
    .collection('workspaces')
    .doc(userId)
    .collection('notes')
    .orderBy('created', 'desc');

  // 🔹 Real-time listener
  notesRef.onSnapshot(snapshot => {
    notesDiv.innerHTML = '';

    snapshot.forEach(doc => {
      const note = doc.data();

      const row = document.createElement('div');
      row.className = 'note';

      const checkbox = document.createElement('input');
      checkbox.type = 'checkbox';
      checkbox.dataset.id = doc.id;

      const text = document.createElement('div');
      text.className = 'note-text';
      text.textContent = note.text;

      row.appendChild(checkbox);
      row.appendChild(text);
      notesDiv.appendChild(row);
    });
  });

  // 🔹 Save note
  document.getElementById('saveBtn').onclick = () => {
    const text = input.value.trim();
    if (!text) return;

    notesRef.add({
      text,
      created: firebase.firestore.FieldValue.serverTimestamp()
    });

    input.value = '';
  };

  // 🔹 Delete selected
  document.getElementById('deleteBtn').onclick = async () => {
    const checks = document.querySelectorAll('input[type=checkbox]:checked');
    for (const cb of checks) {
      await notesRef.doc(cb.dataset.id).delete();
    }
  };
</script>

</body>
</html>
