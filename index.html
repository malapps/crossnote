<!DOCTYPE html>
<html>
<head>
    <title>Cross Note Spaces</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 40px;
            text-align: center;
        }
        #spaceInput {
            padding: 10px;
            width: 250px;
            font-size: 16px;
        }
        #goBtn {
            padding: 10px 20px;
            font-size: 16px;
            margin-left: 10px;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <h1>Cross Note</h1>
    <p>Create or open your own note space</p>

    <input id="spaceInput" type="text" placeholder="e.g. fdr99notes">
    <button id="goBtn">Go</button>

    <script>
        document.getElementById("goBtn").addEventListener("click", function () {
            const space = document.getElementById("spaceInput").value.trim();
            if (space === "") return;
            window.location.href = window.location.origin + "/crossnote/" + space;
        });
    </script>

</body>
</html>
