<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Enter Your Initials</title>
  <style>
    body { font-family: sans-serif; max-width: 400px; margin: 4rem auto; }
    input { width: 100%; padding: 1rem; font-size: 1.2rem; }
    button { margin-top: 1rem; padding: 1rem; width: 100%; font-size: 1.2rem; }
  </style>
</head>
<body>

  <h1>Your Vanity URL</h1>
  <p>Enter your initials to continue:</p>

  <input id="initials" placeholder="e.g. fdr" maxlength="10">
  <button onclick="go()">Continue</button>

  <script>
    // Auto-forward if user has a saved vanity URL
     const last = localStorage.getItem("lastInitials");
     if (last) {
     window.location.href = "./" + last;
    }

    function go() {
      const val = document.getElementById('initials').value.trim().toLowerCase();
      if (!val) return alert("Please enter something");
      window.location.href = "./" + val;
    }
  </script>

</body>
</html>
