<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Crossnote</title>
</head>
<body>

  <h1>Cross Note</h1>

  <input id="code" placeholder="Enter initials">
  <button onclick="go()">CREATE</button>

  <script>
    function go() {
      const code = document.getElementById('code').value.trim();
      if (!code) return;

      const base = '/crossnote/';
      window.location.href = base + code;
    }
  </script>

</body>
</html>
