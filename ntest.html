<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Tick Sheet</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
    body {
        margin: 0;
        padding: 0;
        background: #F5F5F5;
        font-family: Arial, sans-serif;
        display: flex;
        justify-content: center;
    }

    .container {
        width: 100%;
        max-width: 480px;
        padding: 20px;
        box-sizing: border-box;
        text-align: center;
    }

    .logo {
        width: 150px;
        margin: 20px auto;
        display: block;
    }

    .add-btn {
        margin-top: 20px;
        padding: 14px 20px;
        font-size: 16px;
        background: white;
        color: black;
        border: 2px solid #412d77;
        border-radius: 8px;
        cursor: pointer;
        display: inline-block;
    }

    .add-btn:hover {
        background: #f3f0fa;
    }

    .input-row {
        margin-top: 20px;
        display: flex;
        gap: 10px;
        justify-content: center;
    }

    .pill-input {
        flex: 1;
        padding: 12px;
        font-size: 16px;
        border-radius: 12px;
        border: 1px solid #aaa;
        background: #fff;
        outline: none;
        transition: 0.2s;
    }

    .pill-input:focus {
        border-color: #412d77;
        box-shadow: 0 0 4px rgba(65, 45, 119, 0.6);
    }

    .save-btn {
        padding: 0 18px;
        font-size: 16px;
        background: white;
        color: black;
        border: 2px solid #412d77;
        border-radius: 8px;
        cursor: pointer;
    }

    .save-btn:hover {
        background: #f3f0fa;
    }

    .item-row {
        margin-top: 16px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        background: rgba(255,255,255,0.7);
        padding: 12px;
        border-radius: 10px;
        border: 2px solid transparent;
        transition: 0.2s;
    }

    .item-row.selected {
        border: 2px solid #412d77;
    }

    .item-label {
        font-size: 18px;
        text-align: left;
        flex: 1;
        cursor: pointer;
    }

    /* Custom checkbox wrapper */
    .checkbox-wrapper {
        position: relative;
        width: 24px;
        height: 24px;
        margin-left: 10px;
    }

    /* Hide the real checkbox */
    .checkbox-wrapper input {
        opacity: 0;
        width: 24px;
        height: 24px;
        position: absolute;
        left: 0;
        top: 0;
        cursor: pointer;
    }

    /* Custom box */
    .custom-checkbox {
        width: 24px;
        height: 24px;
        border: 1px solid #999;
        border-radius: 6px;
        background: white;
        display: flex;
        align-items: center;
        justify-content: center;
        pointer-events: none;
        font-size: 18px;
        font-weight: bold;
        color: white;
        transition: 0.2s;
    }

    /* Checked state: bright green + white Y */
    .checkbox-wrapper input:checked + .custom-checkbox {
        background: #05ffa1;
        border-color: #412d77;
    }

    .checkbox-wrapper input:checked + .custom-checkbox::after {
        content: "Y";
        color: white;
    }

    .icon-btn {
        background: none;
        border: none;
        font-size: 20px;
        cursor: pointer;
        margin-left: 10px;
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.2s;
    }

    .item-row.selected .icon-btn {
        opacity: 1;
        pointer-events: auto;
    }

    .icon-btn:hover {
        opacity: 0.7;
    }
</style>
</head>

<body>
<div class="container">

    <img src="tslogo.png" alt="Tick Sheet Logo" class="logo">

    <button id="addItemBtn" class="add-btn">Add item</button>

    <div id="inputArea"></div>

    <div id="itemsList"></div>

</div>

<script type="module">
    /* ---------------- FIREBASE IMPORTS ---------------- */
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { 
        getFirestore, doc, setDoc, getDoc, getDocs, collection 
    } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    /* ---------------- FIREBASE CONFIG ---------------- */
    const firebaseConfig = {
        apiKey: "AIzaSyAKux_A12z_UGBFhvVFiFCfbDG9pJGhcuQ",
        authDomain: "tick-17523.firebaseapp.com",
        projectId: "tick-17523",
        storageBucket: "tick-17523.firebasestorage.app",
        messagingSenderId: "935572869464",
        appId: "1:935572869464:web:e47e7c8fbf741573c4952d"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    /* TEMP user ID (will be replaced by vanity URL later) */
    const userId = "nc";

    /* ---------------- DATE KEY ---------------- */
    function getDateKey() {
        const d = new Date();
        return d.toISOString().slice(0,10).replace(/-/g, "");
    }

    const todayKey = getDateKey();

    /* ---------------- DOM ELEMENTS ---------------- */
    const addItemBtn = document.getElementById('addItemBtn');
    const inputArea = document.getElementById('inputArea');
    const itemsList = document.getElementById('itemsList');

    function clearSelections() {
        document.querySelectorAll('.item-row').forEach(row => {
            row.classList.remove('selected');
        });
    }

    /* ---------------- SHOW INPUT ROW ---------------- */
    function showInputRow() {
        inputArea.innerHTML = `
            <div class="input-row">
                <input type="text" id="pillInput" class="pill-input" placeholder="Enter medication name">
                <button class="save-btn" id="saveBtn">Save</button>
            </div>
        `;
        document.getElementById('saveBtn').addEventListener('click', saveItem);
    }

    /* ---------------- SAVE NEW LABEL ---------------- */
    async function saveItem() {
        const input = document.getElementById('pillInput');
        const label = input.value.trim();
        if (!label) return;

        const itemRef = doc(db, "users", userId, "days", todayKey, "items", label);

        await setDoc(itemRef, {
            label: label,
            checked: false
        });

        addItemToList(label, false);
        inputArea.innerHTML = '';
    }

    /* ---------------- ADD ROW TO UI ---------------- */
    function addItemToList(label, checked) {
        const row = document.createElement('div');
        row.className = 'item-row';

        row.innerHTML = `
            <div class="item-label">${label}</div>

            <label class="checkbox-wrapper">
                <input type="checkbox" ${checked ? "checked" : ""}>
                <span class="custom-checkbox"></span>
            </label>

            <button class="icon-btn edit-btn" title="Edit">🖉</button>
            <button class="icon-btn delete-btn" title="Delete">✖</button>
        `;

        const labelDiv = row.querySelector('.item-label');
        const checkbox = row.querySelector('input[type="checkbox"]');
        const editBtn = row.querySelector('.edit-btn');
        const deleteBtn = row.querySelector('.delete-btn');

        /* Select row */
        row.addEventListener('click', (e) => {
            if (e.target.tagName === "INPUT") return;
            clearSelections();
            row.classList.add('selected');
        });

        /* Save tick state */
        checkbox.addEventListener('change', async () => {
            const itemRef = doc(db, "users", userId, "days", todayKey, "items", label);
            await setDoc(itemRef, { checked: checkbox.checked }, { merge: true });
        });

        /* Edit label */
        function enterEditMode() {
            const currentText = labelDiv.textContent;
            labelDiv.innerHTML = `
                <input type="text" class="pill-input" value="${currentText}">
            `;
            const input = labelDiv.querySelector('input');
            input.focus();

            editBtn.textContent = 'Save';
            editBtn.title = 'Save';

            editBtn.onclick = async () => {
                const newText = input.value.trim();
                const finalText = newText || currentText;

                /* Delete old doc, create new doc */
                const oldRef = doc(db, "users", userId, "days", todayKey, "items", currentText);
                const newRef = doc(db, "users", userId, "days", todayKey, "items", finalText);

                await setDoc(newRef, { label: finalText, checked: checkbox.checked });
                await setDoc(oldRef, {}, { merge: false }).catch(()=>{});
                
                labelDiv.textContent = finalText;

                editBtn.textContent = '🖉';
                editBtn.title = 'Edit';
                editBtn.onclick = enterEditMode;
            };
        }

        editBtn.onclick = enterEditMode;

        /* Delete item */
        deleteBtn.addEventListener('click', async () => {
            const itemRef = doc(db, "users", userId, "days", todayKey, "items", label);
            await setDoc(itemRef, {}, { merge: false }).catch(()=>{});
            row.remove();
        });

        itemsList.appendChild(row);
    }

    /* ---------------- LOAD TODAY'S ITEMS ---------------- */
    async function loadItems() {
        const colRef = collection(db, "users", userId, "days", todayKey, "items");
        const snapshot = await getDocs(colRef);

        snapshot.forEach(docSnap => {
            const data = docSnap.data();
            addItemToList(data.label, data.checked);
        });
    }

    loadItems();

    addItemBtn.addEventListener('click', showInputRow);

    document.addEventListener('click', (e) => {
        if (!e.target.closest('.item-row')) {
            clearSelections();
        }
    });
</script>

</body>
</html>
